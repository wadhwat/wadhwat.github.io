<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300"
     role="img" aria-labelledby="title description">
  <title id="title">HarmoniCore ring-modulator fixed-point datapath</title>
  <desc id="description">An 18-bit phase accumulator feeds a quadrant mapper. Six mapped
  address bits index a 64-entry Q1.23 quarter-wave sine ROM; the quadrant supplies the
  sign. The resulting oscillator multiplies a 24-bit Q1.23 audio sample into a 48-bit
  product, which is shifted right by 23 and saturated back to 24 bits.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#8a8377"/>
    </marker>
    <style>
      .box{fill:#f3f1ec;stroke:#1a1815;stroke-width:1.4}
      .op{fill:#fbfaf8;stroke:#1e4d3c;stroke-width:1.8}
      .title{font:600 14px 'Public Sans',system-ui,sans-serif;fill:#1a1815}
      .num{font:500 12px 'JetBrains Mono',ui-monospace,monospace;fill:#1e4d3c}
      .cap{font:400 11px 'JetBrains Mono',ui-monospace,monospace;fill:#8a8377}
      .sig{font:500 12px 'JetBrains Mono',ui-monospace,monospace;fill:#1a1815}
      .wire{stroke:#8a8377;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="300" fill="#fbfaf8"/>

  <rect class="box" x="20" y="24" width="190" height="64"/>
  <text class="title" x="115" y="50" text-anchor="middle">Phase accumulator</text>
  <text class="num" x="115" y="72" text-anchor="middle">18-bit · +27968</text>

  <path class="wire" d="M210 56H250"/>
  <rect class="box" x="254" y="24" width="190" height="64"/>
  <text class="title" x="349" y="50" text-anchor="middle">Quadrant mapping</text>
  <text class="num" x="349" y="72" text-anchor="middle">mirror + sign</text>
  <text class="cap" x="349" y="108" text-anchor="middle">bit 16 mirrors · bit 17 signs</text>

  <path class="wire" d="M444 56H484"/>
  <rect class="box" x="488" y="24" width="200" height="64"/>
  <text class="title" x="588" y="50" text-anchor="middle">Quarter-wave sine ROM</text>
  <text class="num" x="588" y="72" text-anchor="middle">64 × 24-bit · Q1.23</text>

  <path class="wire" d="M688 56H728V174"/>
  <text class="sig" x="700" y="47">osc</text>

  <text class="sig" x="20" y="208">AUDIO IN</text>
  <text class="cap" x="20" y="228">24-bit · Q1.23</text>
  <path class="wire" d="M100 202H696"/>

  <rect class="op" x="700" y="174" width="58" height="58"/>
  <text x="729" y="212" text-anchor="middle"
        font-family="'Public Sans',system-ui,sans-serif" font-size="25"
        fill="#1e4d3c">×</text>
  <text class="num" x="729" y="255" text-anchor="middle">24 × 24 → 48</text>

  <path class="wire" d="M758 203H786"/>
  <rect class="box" x="790" y="174" width="92" height="58"/>
  <text class="title" x="836" y="198" text-anchor="middle">Scale</text>
  <text class="num" x="836" y="218" text-anchor="middle">≫ 23</text>

  <path class="wire" d="M882 203H906"/>
  <text class="sig" x="910" y="199">SAT</text>
  <text class="cap" x="910" y="217">24-bit</text>

  <text class="cap" x="20" y="282">SystemVerilog datapath · fixed-point arithmetic · saturating output</text>
</svg>
