<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 238" width="900" height="238"
     role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ring modulator datapath</title>
  <desc id="d">A phase accumulator increments by 27968 each sample in a 2^18 phase space. Its output indexes a 64-entry quarter-wave sine lookup table in Q11 format, with the remaining three quadrants reconstructed by symmetry. The resulting oscillator sample multiplies the incoming 18-bit audio in an 18 by 18 into 36 bit multiplier, and bits 28 down to 11 of the product become the 18-bit output.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A8377"/>
    </marker>
    <style>
      .bx   { fill: #F3F1EC; stroke: #1A1815; stroke-width: 1.4; }
      .op   { fill: #FBFAF8; stroke: #1E4D3C; stroke-width: 1.8; }
      .ttl  { font: 600 14px "Public Sans", system-ui, sans-serif; fill: #1A1815; }
      .num  { font: 500 11.5px "JetBrains Mono", ui-monospace, monospace; fill: #1E4D3C; }
      .cap  { font: 400 11px "JetBrains Mono", ui-monospace, monospace; fill: #8A8377; }
      .sig  { font: 500 11.5px "JetBrains Mono", ui-monospace, monospace; fill: #1A1815; }
      .wire { stroke: #8A8377; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="900" height="238" fill="#FBFAF8"/>

  <!-- top row: oscillator -->
  <rect class="bx" x="16"  y="22" width="210" height="58"/>
  <text class="ttl" x="121" y="47" text-anchor="middle">Phase accumulator</text>
  <text class="num" x="121" y="66" text-anchor="middle">+27968 per sample</text>
  <text class="cap" x="121" y="98" text-anchor="middle">2^18 phase space</text>

  <path class="wire" d="M226 51 H286" marker-end="url(#a)"/>

  <rect class="bx" x="290" y="22" width="210" height="58"/>
  <text class="ttl" x="395" y="47" text-anchor="middle">Quarter-wave sine LUT</text>
  <text class="num" x="395" y="66" text-anchor="middle">64 entries · Q11</text>
  <text class="cap" x="395" y="98" text-anchor="middle">3 quadrants by symmetry</text>

  <!-- oscillator down into the multiplier -->
  <path class="wire" d="M500 51 H556 V146" marker-end="url(#a)"/>
  <text class="sig" x="512" y="44">osc</text>

  <!-- bottom row: audio path -->
  <text class="sig" x="16" y="180">AUDIO IN</text>
  <text class="cap" x="16" y="197">18 b signed</text>
  <path class="wire" d="M96 175 H524" marker-end="url(#a)"/>

  <rect class="op" x="528" y="147" width="56" height="56"/>
  <text x="556" y="184" text-anchor="middle"
        font-family="'Public Sans', system-ui, sans-serif" font-size="24" fill="#1E4D3C">&#215;</text>
  <text class="num" x="556" y="222" text-anchor="middle">18 &#215; 18 &#8594; 36 b</text>

  <path class="wire" d="M584 175 H628" marker-end="url(#a)"/>

  <rect class="bx" x="632" y="147" width="150" height="56"/>
  <text class="ttl" x="707" y="172" text-anchor="middle">Bit select</text>
  <text class="num" x="707" y="191" text-anchor="middle">[28:11]</text>
  <text class="cap" x="707" y="222" text-anchor="middle">two's complement</text>

  <path class="wire" d="M782 175 H822" marker-end="url(#a)"/>
  <text class="sig" x="828" y="171">AUDIO</text>
  <text class="sig" x="828" y="186">OUT</text>
</svg>
